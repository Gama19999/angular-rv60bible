<section class="reader full grid items-center">
    <app-logo class="logo c1 r1 pointer" (click)="gotoSearch()"></app-logo>
    <div class="bible-info blur-base c2 r1 martel bold sn pointer" [title]="`rev. ${(version$ | async)?.year}`"
        (click)="toggleBibleList()">
        {{ (version$ | async)?.name }}
    </div>
    <div class="bible-versions grid items-center" [class.hidden]="hiddenBibles">
        <span class="martel si">{{ lang.str.reader.bibles }}</span>
        <span class="close-mark pointer c2 r1 sn" (click)="hiddenBibles = true">&#10008;</span>
        @for (bible of (bibles$ | async); track $index) {
            <span class="bible-option martel sn pointer" [class.current-bible]="bible.versionKey === versionKey"
                (click)="setVersionKey(bible.versionKey)">
                {{ bible.name }}
            </span>
        }
    </div>
    <div class="bible-quote blur-base c2 r1 martel bold"
        [style.margin-right.%]="viewTrack.current === 'books' ? '-3.5' : viewTrack.current === 'verses' ? '2.5' : '0'">
        {{ bibleQuote$ | async }}
    </div>
    <router-outlet></router-outlet>
</section>
