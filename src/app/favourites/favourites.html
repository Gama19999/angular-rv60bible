<section class="favourites full grid items-center">
    <app-single-page type="verses" class="full">
        @for (fav of favourites$ | async; track $index) {
            <div class="fav-txt spectral vsn {{ fav.color }}" (contextmenu)="openMenu($event, fav)" (click)="openAt(fav)">
                <span class="bible-quote martel bold" [ngStyle]="{'font-size.rem': verseFontSize === 1 ? 1.3 : verseFontSize}">{{ fav.bookName }} {{ fav.chapterId }}:{{ fav.verseOrdinal }}</span>
                <span [ngStyle]="{'font-size.rem': verseFontSize === 1 ? 1.3 : verseFontSize}">{{ fav.text }}</span>
            </div>
        }
    </app-single-page>
    <app-context-menu [verse-data]="menuData" view="favourites" [ngClass]="{'hidden': menuHidden}"
        [ngStyle]="{'top.px': menuY, 'left.px': menuX}" (close)="this.menuHidden = true"></app-context-menu>
</section>
